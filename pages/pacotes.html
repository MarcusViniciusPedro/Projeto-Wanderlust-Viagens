        <meta charset="UTF-8">

        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>

        <header>
            <nav class="menu navbar navbar-expand-md" aria-label="Menu principal" data-bs-theme="dark">
                <div class="container-fluid">
                    <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                        <img src="../imgs/icon.svg" alt="" class="logo-icon">
                        <span>Wanderlust Viagens</span>
                    </a>

                    <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#menu-nav"
                        aria-controls="menu-nav" aria-expanded="false" aria-label="Abrir menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="menu-nav">
                        <ul class="menu-lista navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link active" aria-current="page" href="pacotes.html">Pacotes</a></li>

                            <li class="nav-item"><a class="nav-link" href="carrinho.html">Carrinho</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="pacotes-main">
            <h1 class="catalogo-titulo">Nossos pacotes</h1>

            <!-- Barra de filtro -->
            <section class="busca" aria-label="Filtrar pacotes">
                <form class="busca-barra" id="form-filtro">
                    <div class="busca-campo">
                        <span class="busca-icone" aria-hidden="true">
                            <img src="../imgs/data_icon.svg" class="busca-icone-img">
                        </span>
                        <label for="filtro-data-inicio" class="busca-label">Data de início</label>
                        <input type="date" id="filtro-data-inicio" name="data_inicio" class="busca-input">
                    </div>

                    <div class="busca-campo">
                        <span class="busca-icone" aria-hidden="true">
                            <img src="../imgs/destino_icon.svg" class="busca-icone-img">
                        </span>
                        <label for="filtro-estado" class="busca-label">Destino</label>
                        <select id="filtro-estado" name="estado" class="busca-input">
                            <option value="" selected>Todos</option>
                        </select>
                    </div>

                    <div class="busca-campo">
                        <span class="busca-icone" aria-hidden="true">
                            <img src="../imgs/tipo_viagem_icon.svg" class="busca-icone-img">
                        </span>
                        <label for="filtro-tipo" class="busca-label">Tipo de viagem</label>
                        <select id="filtro-tipo" name="tipo_viagem" class="busca-input">
                            <option value="" selected>Todos</option>
                            <option value="relax">Relax</option>
                            <option value="cultural">Cultural</option>
                            <option value="radical">Radical</option>
                        </select>
                    </div>

                    <div class="busca-campo busca-campo-valor">
                        <span class="busca-icone" aria-hidden="true">
                            <img src="../imgs/preco_icon.svg" class="busca-icone-img">
                        </span>
                        <label for="filtro-valor" class="busca-label">
                            Valor até <output id="filtro-valor-saida" for="filtro-valor">R$ 50.000,00</output>
                        </label>
                        <input type="range" id="filtro-valor" name="valor_max" class="busca-slider"
                            min="100" max="100000" step="100" value="1000">
                    </div>

                    <button type="submit" class="btn btn-primary busca-botao">Filtrar</button>
                </form>
            </section>

            <p id="pacotes-vazio" class="pacotes-vazio" hidden>
                Nenhum pacote encontrado para os filtros escolhidos.
            </p>

            <div class="pacotes-grade" id="pacotes-grade">
            </div>
        </main>

        <!-- Modais gerados dinamicamente por js/pacotes.js -->
        <div id="pacotes-modais"></div>

        <footer class="rodape">
            <h2>ENTRE EM CONTATO</h2>

            <section aria-label="Informações de contato" class="rodape-contatos">
                <section class="contato-item">
                    <h3>LOCALIZAÇÃO</h3>
                    <p>São Paulo - SP</p>
                </section>

                <section class="contato-item">
                    <h3>TELEFONE</h3>
                    <p><a href="tel:+5511912345678">(11) 9 1234-5678</a></p>
                </section>

                <section class="contato-item">
                    <h3>E-MAIL</h3>
                    <p><a href="mailto:sac@wanderlustviagens.com.br">sac@wanderlustviagens.com.br</a></p>
                </section>

                <section class="contato-item">
                    <h3>REDES SOCIAIS</h3>
                    <p>@wanderlustviagens</p>
                </section>
            </section>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/api.js"></script>

        <script src="../js/admin-link.js"></script>
    </body>
</html>
